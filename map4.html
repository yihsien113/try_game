    function isPointInPolygon(pt, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const intersect = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

      player.y = START_POS.y;
      player.targetX = player.x;
      player.targetY = player.y;
      player.isMoving = false;
      player.frame = 0;
      
      gamePhase = 'playing';
      showCurrentQuestion();
    }

    function updateHUD() {
        document.getElementById('coinDisplay').innerText = stars;
    }

    function endGame() {
      gamePhase = 'result';
      document.getElementById('question-board').style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('hud').style.display = 'none';
      
      let currentCoins = parseInt(localStorage.getItem('playerCoins') || '0');
      let newTotalCoins = currentCoins + stars;
      localStorage.setItem('playerCoins', newTotalCoins); 
      
      document.getElementById('newCoins').innerText = "+" + stars;
      document.getElementById('totalCoins').innerText = newTotalCoins;
      
      let killsHtml = '';
      for (let i = 1; i <= stars; i++) {
        killsHtml += '⭐';
        if (i % 5 === 0) killsHtml += '<br>'; 
      }
      document.getElementById('star-container').innerHTML = killsHtml;
      document.getElementById('result-screen').style.display = 'flex';
    }

    function gameLoop(currentTime) {
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      if (gamePhase !== 'start') {
         update(Math.min(dt, 0.1));
         draw();
      }
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      // 更新雪花飄落位置
    snowflakes.forEach(snow => {
      snow.y += snow.speedY * dt;
      snow.x += (snow.speedX + Math.sin(snow.swingPhase) * 15) * dt;
      snow.swingPhase += 2 * dt;

      // 如果雪花飄出高山多邊形或掉到底部，重置回山頂
      if (snow.y > 1200 || snow.x < 410 || !isPointInPolygon({ x: snow.x, y: snow.y }, regionMountain)) {
        snow.x = 550 + Math.random() * 350; // 山頭高處
        snow.y = 220 + Math.random() * 150;
      }
    });
      if (gamePhase === 'ending') {
          whiteFade += dt * 1.5; 
          if (whiteFade >= 1) {
            whiteFade = 1;
            endGame();
          }
      }

      // 處理人物移動
      if (player.isMoving) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let moveDist = player.speedPxPerSec * dt;

        if (distance > moveDist) {
          player.x += (dx / distance) * moveDist;
          player.y += (dy / distance) * moveDist;
          player.walkCycle += 25 * dt; 
        } else {
          // 人物到達目標並停止
          player.x = player.targetX;
          player.y = player.targetY;
          player.isMoving = false;
          player.walkCycle = 0;
          
          if (returningToStart) {
            // 已經安全走回起點！
            returningToStart = false;
            
            if (currentQIndex >= MAX_QUESTIONS) {
              setTimeout(() => {
                gamePhase = 'ending';
              }, 400);
            } else {
              showCurrentQuestion();
            }
          } else if (gamePhase === 'playing') {
            checkAnswer();
          }
        }
      }
    }

    function checkAnswer() {
        const pt = { x: player.x, y: player.y };
        let hitArea = null;

        if (isPointInPolygon(pt, regionForest)) hitArea = 'forest';
        else if (isPointInPolygon(pt, regionRiver)) hitArea = 'river';
        else if (isPointInPolygon(pt, regionMountain)) hitArea = 'mountain';

        if (hitArea) {
            let correctArea = questionsPool[currentQIndex].answerArea;
            
            if (hitArea === correctArea) {
                stars += 2;
                addPopup('+2 ⭐', player.x, player.y - 60, '#FFD700');
                updateHUD();
            } else {
                addPopup('❌', player.x, player.y - 60, '#FF3B30');
            }
            
            currentQIndex++;

            // 停頓 0.5 秒後，自動安全走回初始待機點
            setTimeout(() => {
                returningToStart = true;
                player.targetX = START_POS.x;
                player.targetY = START_POS.y;
                player.isMoving = true;
                player.isFacingLeft = player.targetX < player.x;
            }, 500);
        }
    }

    function draw() {
      ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      const now = performance.now();
      ctx.save();
      for (let snow of snowflakes) {
        ctx.beginPath();
        ctx.arc(snow.x, snow.y, snow.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${snow.alpha})`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 4; // 柔和發光感
        ctx.fill();
      }
      ctx.restore();

      // 繪製人物
      ctx.save(); 
      let offsetY = player.isMoving ? Math.sin(player.walkCycle * 2) * 6 : 0;         
      let rotationAngle = player.isMoving ? Math.sin(player.walkCycle) * 0.20 : 0;   

      ctx.translate(player.x, player.y + offsetY);
      ctx.rotate(rotationAngle);
      
      const currentImg = playerImages[player.frame];
      if(currentImg) {
          if (player.isFacingLeft) {
            ctx.scale(-1, 1);
            ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);
          } else {
            ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);
          }
      }
      ctx.restore(); 

      // 繪製動態特效字
      for (let i = popupTexts.length - 1; i >= 0; i--) {
          const popup = popupTexts[i];
          const progress = (now - popup.startTime) / popup.duration;
          
          if (progress >= 1) {
              popupTexts.splice(i, 1);
          } else {
              ctx.save();
              ctx.globalAlpha = 1 - Math.pow(progress, 3); 
              const floatY = popup.y - (progress * 50); 
              ctx.font = `bold ${popup.size}px sans-serif`;
              ctx.fillStyle = popup.color;
              ctx.strokeStyle = '#000';
              ctx.lineWidth = 5;
              ctx.textAlign = 'center';
              ctx.strokeText(popup.text, popup.x, floatY);
              ctx.fillText(popup.text, popup.x, floatY);
              ctx.restore();
          }
      }

      // 白屏淡出
      if ((gamePhase === 'ending' || gamePhase === 'result') && whiteFade > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${whiteFade})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    // 點擊移動（返回起點途中防誤觸）
    canvas.addEventListener('pointerdown', (e) => {
      if (e.target.tagName.toLowerCase() === 'button') return;
      if (gamePhase !== 'playing' || returningToStart) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      player.isFacingLeft = clickX < player.x;
      player.targetX = clickX;
      player.targetY = clickY;
      player.isMoving = true;
    });
  </script>
</body>
