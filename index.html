<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>詹粢涵娃娃屋尋寶</title>
  
  <!-- 引入 PWA 清單 -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none; 
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 999;
    }
    .spinner {
      margin-bottom: 20px;
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff4081;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #game-container {
      position: relative;
      width: 95vw;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: none; 
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #ff4081;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
      transition: transform 0.1s;
    }
    
    .btn:active {
      transform: scale(0.95);
    }

    #hud {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 15px;
      pointer-events: none;
      z-index: 100;
      display: none;
      backdrop-filter: blur(4px);
    }

    /* 調整星星容器：限制每行最多12個（28px * 12），超過自動換行 */
    #star-container {
      font-size: 28px;
      margin-top: 15px;
      width: 336px; 
      max-width: 90vw;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      line-height: 1.2;
      text-shadow: 0 0 10px rgba(255,215,0,0.8);
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">娃娃屋載入中 (0/7)...</div>
  </div>

  <div id="game-container">
    <div id="hud">⏳ <span id="timerDisplay">20</span> | ⭐ <span id="scoreDisplay">0</span></div>
    
    <div id="start-screen" class="overlay" style="display: none;">
      <h1 style="font-size: 32px; margin-bottom: 10px;">娃娃屋討伐戰</h1>
      <p style="font-size: 18px; margin: 0;">20秒內，盡可能消滅最多的裂縫怪物！</p>
      <button class="btn" onclick="startGame()">開始遊戲</button>
    </div>

    <div id="result-screen" class="overlay" style="display: none;">
      <button class="btn" style="position: absolute; top: 20px; left: 20px; margin-top: 0; padding: 10px 20px; font-size: 18px;" onclick="window.location.href='index.html'">🔙 返回大廳</button>
      <h1 style="font-size: 36px; color: #ffeb3b; margin: 0;">時間到！</h1>
      <h2 style="font-size: 28px; margin: 10px 0;">總得分: <span id="finalScore">0</span> 分</h2>
      <div id="star-container"></div>
      <button class="btn" onclick="startGame()">再玩一次</button>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    // 註冊 PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker 註冊成功！'))
          .catch(err => console.log('PWA 註冊失敗:', err));
      });
    }

    const loadingScreen = document.getElementById('loading-screen');
    const loadingText = document.getElementById('loading-text');
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 20;
    let isPlaying = false;
    let timerId = null;
    let lastTime = 0; 

    const player = {
      x: 0, y: 0,
      size: 160,           
      speedPxPerSec: 900,       
      targetX: 0, targetY: 0,
      frame: 0, 
      isAttacking: false,
      isFacingLeft: false, 
      isMoving: false,     
      walkCycle: 0,        
      hitboxOffsetX: 100,   
      hitboxOffsetY: 0, 
      hitboxRadius: 30     
    };

    const monster = {
      x: 0, y: 0,
      size: 120,           
      isVisible: false,
      frame: 0,
      animationInterval: null
    };

    const spawnZones = [
      // 整個房屋
      [
        { x: 443, y: 117 },
        { x: 99, y: 405 },
        { x: 102, y: 1103 },
        { x: 818, y: 1106 },
        { x: 821, y: 332 },
      ]
    ];

    function spawnMonster() {
      const zonePoints = spawnZones[Math.floor(Math.random() * spawnZones.length)];
      const path = new Path2D();
      path.moveTo(zonePoints[0].x, zonePoints[0].y);
      for (let i = 1; i < zonePoints.length; i++) {
        path.lineTo(zonePoints[i].x, zonePoints[i].y);
      }
      path.closePath();

      let isInside = false;
      let rx, ry;

      while (!isInside) {
        rx = Math.random() * canvas.width;
        ry = Math.random() * canvas.height;
        if (ctx.isPointInPath(path, rx, ry)) {
          isInside = true;
        }
      }

      monster.x = rx;
      monster.y = ry;
      monster.isVisible = true;
      monster.frame = 0;

      if (monster.animationInterval) clearInterval(monster.animationInterval);
      monster.animationInterval = setInterval(() => {
        if (monster.frame < 2) {
          monster.frame++;
        } else {
          clearInterval(monster.animationInterval);
        }
      }, 150);
    }

    let totalAssets = 7;
    let loadedAssets = 0;

    function checkLoadProgress() {
      loadedAssets++;
      loadingText.innerText = `娃娃屋載入中 (${loadedAssets}/${totalAssets})...`;
      
      if (loadedAssets === totalAssets) {
        loadingScreen.style.display = 'none';
        container.style.display = 'block';
        
        document.getElementById('start-screen').style.display = 'flex';
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    const bgImg = new Image();
    bgImg.src = 'map1_s.webp'; 
    bgImg.onload = () => {
      canvas.width = bgImg.width;
      canvas.height = bgImg.height;
      container.style.aspectRatio = `${bgImg.width} / ${bgImg.height}`;

      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;

      checkLoadProgress();
    };

    const playerSources = ['han1-1.webp', 'han1-2.webp', 'han1-3.webp'];
    const playerImages = [];
    playerSources.forEach((src, idx) => {
      const img = new Image();
      img.src = src;
      img.onload = () => checkLoadProgress();
      playerImages[idx] = img;
    });

    const monsterSources = ['bad1-1.webp', 'bad1-2.webp', 'bad1-3.webp'];
    const monsterImages = [];
    monsterSources.forEach((src, idx) => {
      const img = new Image();
      img.src = src;
      img.onload = () => checkLoadProgress();
      monsterImages[idx] = img;
    });

    function startGame() {
      score = 0;
      timeLeft = 20;
      isPlaying = true;
      
      document.getElementById('scoreDisplay').innerText = score;
      document.getElementById('timerDisplay').innerText = timeLeft;
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;
      player.isMoving = false;
      player.isAttacking = false;
      player.frame = 0;
      
      spawnMonster();
      
      if (timerId) clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').innerText = timeLeft;
        
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerId);
      if (monster.animationInterval) clearInterval(monster.animationInterval);
      
      monster.isVisible = false;
      player.isMoving = false;
      player.targetX = player.x;
      player.targetY = player.y;
      
      document.getElementById('hud').style.display = 'none';
      document.getElementById('finalScore').innerText = score;
      
      let killsHtml = '';
      for (let i = 1; i <= score; i++) {
        killsHtml += '⭐';
        if (i % 10 === 0) {
          killsHtml += '<br>'; // 每滿 10 個自動換行
        }
      }
      
      document.getElementById('star-container').innerHTML = killsHtml;
      
      document.getElementById('result-screen').style.display = 'flex';
    }

    function gameLoop(currentTime) {
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      const safeDt = Math.min(dt, 0.1);

      update(safeDt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      if (!player.isAttacking) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        let moveDistanceThisFrame = player.speedPxPerSec * dt;

        if (distance > moveDistanceThisFrame) {
          player.x += (dx / distance) * moveDistanceThisFrame;
          player.y += (dy / distance) * moveDistanceThisFrame;
          player.isMoving = true;
          player.walkCycle += 25 * dt; 
        } else {
          if (player.isMoving) {
            player.x = player.targetX;
            player.y = player.targetY;
            player.isMoving = false;
            player.walkCycle = 0;
            
            playSlash();
          }
        }
      } else {
        player.isMoving = false;
        player.walkCycle = 0;
      }
    }

    function draw() {
      ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

      if (monster.isVisible) {
        ctx.drawImage(
          monsterImages[monster.frame], 
          monster.x - monster.size / 2, 
          monster.y - monster.size / 2, 
          monster.size, 
          monster.size
        );
      }

      ctx.save(); 

      ctx.globalAlpha = 1.0;  

      let offsetY = 0;
      let rotationAngle = 0;

      if (player.isMoving) {
        offsetY = Math.sin(player.walkCycle * 2) * 6;         
        rotationAngle = Math.sin(player.walkCycle) * 0.20;   
      }

      ctx.translate(player.x, player.y + offsetY);
      ctx.rotate(rotationAngle);

      const currentImg = playerImages[player.frame];

      if (player.isFacingLeft) {
        ctx.scale(-1, 1);
        ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);
      } else {
        ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);
      }

      ctx.restore(); 
    }

    function playSlash() {
      if (player.isAttacking) return;
      player.isAttacking = true;
      const frameSpeed = 90;

      player.frame = 0; 
      setTimeout(() => {
        player.frame = 1; 
        
        const currentOffsetX = player.isFacingLeft ? -player.hitboxOffsetX : player.hitboxOffsetX;
        const attackCenterX = player.x + currentOffsetX;
        const attackCenterY = player.y + player.hitboxOffsetY;
        
        const distToMonster = Math.sqrt(Math.pow(attackCenterX - monster.x, 2) + Math.pow(attackCenterY - monster.y, 2));
        
        if (monster.isVisible && distToMonster <= (player.hitboxRadius + monster.size / 2)) {
          monster.isVisible = false;
          
          if (isPlaying) {
            score++;
            document.getElementById('scoreDisplay').innerText = score;
            spawnMonster(); 
          }
        }

        setTimeout(() => {
          player.frame = 2; 
          setTimeout(() => {
            player.frame = 0; 
            player.isAttacking = false;
          }, frameSpeed);
        }, frameSpeed);
      }, frameSpeed);
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!isPlaying || player.isAttacking) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      player.isFacingLeft = clickX < player.x;

      if (player.isFacingLeft) {
        player.targetX = clickX + player.hitboxOffsetX;
      } else {
        player.targetX = clickX - player.hitboxOffsetX;
      }
      player.targetY = clickY - player.hitboxOffsetY;

      const distToTarget = Math.sqrt(Math.pow(player.targetX - player.x, 2) + Math.pow(player.targetY - player.y, 2));
      
      if (distToTarget <= 15) {
        playSlash();
      } else {
        player.isMoving = true;
      }
    });
  </script>
</body>
</html>
