<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芝涵尋寶冒險</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none; 
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 92vw;               
      max-width: 1024px;         
      max-height: 80vh;          
      
      background-image: url('bg_photo.jpg'); 
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-layer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
    }
    .btn-attack {
      width: 80px;
      height: 80px;
      font-size: 32px;
      color: #fff;
      background: linear-gradient(135deg, #ff4081, #ff80ab);
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    .btn-attack:active {
      transform: scale(0.88);
      background: #ff4081;
    }
    .instruction {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="instruction">👆 點擊畫面移動，讓「劍氣範圍」對準目標</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
      <div class="btn-attack" id="attackBtn">⚔️</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const attackBtn = document.getElementById('attackBtn');

    // --- 1. 角色屬性與設定 ---
    const player = {
      x: 0,
      y: 0,
      size: 400,          // 修改 1: 尺寸放大至 400
      speed: 15,          // 修改 1: 移動速度提升至 15
      targetX: 0,
      targetY: 0,
      frame: 0,
      isAttacking: false,
      
      // 攻擊範圍參數 (相對於人物中心點)
      hitboxOffsetX: 200, // 攻擊圈在人物偏右方 200px 處
      hitboxOffsetY: 0,
      hitboxRadius: 80    // 修改 2: 半徑縮小 50% (原比例對應為 160，現改為 80)
    };

    // --- 2. 自動讀取底圖 PNG 比例 ---
    const bgImg = new Image();
    bgImg.src = 'bg_photo.jpg';
    bgImg.onload = () => {
      canvas.width = bgImg.width;
      canvas.height = bgImg.height;
      container.style.aspectRatio = `${bgImg.width} / ${bgImg.height}`;

      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;

      gameLoop();
    };

    // --- 3. 載入去背角色動作圖片 ---
    const sources = ['frame1_nobg.png', 'frame2_nobg.png', 'frame3_nobg.png'];
    const images = [];
    let loadedCount = 0;

    sources.forEach((src, idx) => {
      const img = new Image();
      img.src = src;
      img.onload = () => loadedCount++;
      images[idx] = img;
    });

    // --- 4. 遊戲主迴圈 (Game Loop) ---
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // --- 5. 移動邏輯更新 ---
    function update() {
      if (!player.isAttacking) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > player.speed) {
          player.x += (dx / distance) * player.speed;
          player.y += (dy / distance) * player.speed;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
        }
      }
    }

    // --- 6. 畫面渲染繪製 ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (loadedCount === sources.length) {
        const currentImg = images[player.frame];
        
        // 繪製角色（以角色中心為基準）
        const drawX = player.x - (player.size / 2);
        const drawY = player.y - (player.size / 2);
        
        ctx.drawImage(currentImg, drawX, drawY, player.size, player.size);

        // 揮劍攻擊時顯示攻擊判定圈（紅色半透明）
        if (player.isAttacking && player.frame === 1) {
          ctx.beginPath();
          // 繪製縮小後的攻擊圈
          ctx.arc(player.x + player.hitboxOffsetX, player.y + player.hitboxOffsetY, player.hitboxRadius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 64, 129, 0.4)';
          ctx.fill();
        }
      }
    }

    // --- 7. 揮劍動作控制 ---
    function playSlash() {
      if (player.isAttacking) return;
      player.isAttacking = true;

      const frameSpeed = 90;

      player.frame = 0; 
      setTimeout(() => {
        player.frame = 1; 
        
        setTimeout(() => {
          player.frame = 2; 
          
          setTimeout(() => {
            player.frame = 0; 
            player.isAttacking = false;
          }, frameSpeed);
        }, frameSpeed);
      }, frameSpeed);
    }

    // --- 8. 觸控與點擊定位計算 ---
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      // 取得玩家實際點擊的 Canvas 內部座標
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      // 修改 3: 目標 X/Y 需扣除攻擊圈的偏移量
      // 這樣人物走位停下時，攻擊圈的中心點才會剛好落在滑鼠/手指點擊的位置
      player.targetX = clickX - player.hitboxOffsetX;
      player.targetY = clickY - player.hitboxOffsetY;
    });

    // 綁定右下角揮劍按鈕
    attackBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation(); 
      playSlash();
    });
  </script>
</body>
</html>
