<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>張芝涵娃娃屋尋寶</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none; 
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* 載入中提示畫面 */
    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 999;
    }
    .spinner {
      margin-bottom: 20px;
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff4081;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #game-container {
      position: relative;
      /* 讓容器在手機/平板畫面上最大化，但維持照片原比例 */
      width: 95vw;
      max-width: 100%;
      max-height: 85vh;
      
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: none; /* 載入完成前先隱藏 */
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui-layer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
    }
    .btn-attack {
      width: 75px;
      height: 75px;
      font-size: 30px;
      color: #fff;
      background: linear-gradient(135deg, #ff4081, #ff80ab);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    .btn-attack:active {
      transform: scale(0.88);
      background: #ff4081;
    }
    .instruction {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- Loading 介面 -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">娃娃屋載入中 (0/4)...</div>
  </div>

  <div id="game-container">
    <div class="instruction">👆 點擊娃娃屋移動，按右下角揮劍</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
      <div class="btn-attack" id="attackBtn">⚔️</div>
    </div>
  </div>

  <script>
    const loadingScreen = document.getElementById('loading-screen');
    const loadingText = document.getElementById('loading-text');
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const attackBtn = document.getElementById('attackBtn');

    // 角色設定：可依娃娃屋格子比例調整大小
    const player = {
      x: 0, y: 0,
      size: 150,          // 人物尺寸
      speed: 5,          // 移動速度
      targetX: 0, targetY: 0,
      frame: 0, isAttacking: false,
      hitboxOffsetX: 80,  // 攻擊中心偏移量
      hitboxOffsetY: 0, 
      hitboxRadius: 30    // 攻擊範圍半徑
    };

    let totalAssets = 4;
    let loadedAssets = 0;

    function checkLoadProgress() {
      loadedAssets++;
      loadingText.innerText = `娃娃屋載入中 (${loadedAssets}/${totalAssets})...`;
      
      if (loadedAssets === totalAssets) {
        loadingScreen.style.display = 'none';
        container.style.display = 'block';
        gameLoop();
      }
    }

    // --- 1. 載入壓縮後的背景圖 ---
    const bgImg = new Image();
    bgImg.src = 'bg_photo_compressed.jpg'; // 使用壓縮後的圖檔
    bgImg.onload = () => {
      // 將 Canvas 解析度完全設為圖片真實解析度 (保證不失真)
      canvas.width = bgImg.width;
      canvas.height = bgImg.height;

      // 強制容器長寬比例與背景照片 100% 一致 (解決在手機上拉長變形問題)
      container.style.aspectRatio = `${bgImg.width} / ${bgImg.height}`;

      // 預設人物在照片正中央
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;

      checkLoadProgress();
    };

    // --- 2. 載入去背角色圖片 ---
    const sources = ['frame1_nobg.png', 'frame2_nobg.png', 'frame3_nobg.png'];
    const images = [];

    sources.forEach((src, idx) => {
      const img = new Image();
      img.src = src;
      img.onload = () => checkLoadProgress();
      images[idx] = img;
    });

    // --- 3. 遊戲主迴圈 ---
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      if (!player.isAttacking) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > player.speed) {
          player.x += (dx / distance) * player.speed;
          player.y += (dy / distance) * player.speed;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
        }
      }
    }

    function draw() {
      // 在 Canvas 上直接繪製背景底圖 (效能與相容性最好)
      ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

      // 繪製角色
      const currentImg = images[player.frame];
      const drawX = player.x - (player.size / 2);
      const drawY = player.y - (player.size / 2);
      ctx.drawImage(currentImg, drawX, drawY, player.size, player.size);

      // 揮劍範圍顯示
      if (player.isAttacking && player.frame === 1) {
        ctx.beginPath();
        ctx.arc(player.x + player.hitboxOffsetX, player.y + player.hitboxOffsetY, player.hitboxRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 64, 129, 0.4)';
        ctx.fill();
      }
    }

    function playSlash() {
      if (player.isAttacking) return;
      player.isAttacking = true;
      const frameSpeed = 90;

      player.frame = 0; 
      setTimeout(() => {
        player.frame = 1; 
        setTimeout(() => {
          player.frame = 2; 
          setTimeout(() => {
            player.frame = 0; 
            player.isAttacking = false;
          }, frameSpeed);
        }, frameSpeed);
      }, frameSpeed);
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      // 點擊移動時，攻擊圈中心點精確對準點擊位置
      player.targetX = clickX - player.hitboxOffsetX;
      player.targetY = clickY - player.hitboxOffsetY;
    });

    attackBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation(); 
      playSlash();
    });
  </script>
</body>
</html>
