<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>張芝涵娃娃屋尋寶</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none; 
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 999;
    }
    .spinner {
      margin-bottom: 20px;
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff4081;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #game-container {
      position: relative;
      width: 95vw;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: none; 
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .instruction {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">娃娃屋載入中 (0/4)...</div>
  </div>

  <div id="game-container">
    <div class="instruction">👆 點擊目標物品，到達後會自動揮刀攻擊！</div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const loadingScreen = document.getElementById('loading-screen');
    const loadingText = document.getElementById('loading-text');
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 角色屬性 (依最新要求更新)
    const player = {
      x: 0, y: 0,
      size: 150,           // 修改 2: 人物 size 改為 150
      speed: 5,            // 修改 3: 移動速度改為 5
      targetX: 0, targetY: 0,
      frame: 0, 
      isAttacking: false,
      isFacingLeft: false, 
      isMoving: false,     
      walkCycle: 0,        
      hitboxOffsetX: 40,   // 依比例調小的攻擊中心偏移量
      hitboxOffsetY: 0, 
      hitboxRadius: 30     // 修改 4: 攻擊範圍改為 30
    };

    let totalAssets = 4;
    let loadedAssets = 0;

    function checkLoadProgress() {
      loadedAssets++;
      loadingText.innerText = `娃娃屋載入中 (${loadedAssets}/${totalAssets})...`;
      
      if (loadedAssets === totalAssets) {
        loadingScreen.style.display = 'none';
        container.style.display = 'block';
        gameLoop();
      }
    }

    const bgImg = new Image();
    bgImg.src = 'bg_photo_compressed.jpg';
    bgImg.onload = () => {
      canvas.width = bgImg.width;
      canvas.height = bgImg.height;
      container.style.aspectRatio = `${bgImg.width} / ${bgImg.height}`;

      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;

      checkLoadProgress();
    };

    const sources = ['frame1_nobg.png', 'frame2_nobg.png', 'frame3_nobg.png'];
    const images = [];

    sources.forEach((src, idx) => {
      const img = new Image();
      img.src = src;
      img.onload = () => checkLoadProgress();
      images[idx] = img;
    });

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      if (!player.isAttacking) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        // 自動轉向判定
        if (Math.abs(dx) > 2) {
          player.isFacingLeft = dx < 0;
        }

        if (distance > player.speed) {
          player.x += (dx / distance) * player.speed;
          player.y += (dy / distance) * player.speed;
          player.isMoving = true;
          player.walkCycle += 0.25; 
        } else {
          // 到達目的地時
          if (player.isMoving) {
            player.x = player.targetX;
            player.y = player.targetY;
            player.isMoving = false;
            player.walkCycle = 0;
            
            // 修改 1: 到達目的地後自動揮刀攻擊！
            playSlash();
          }
        }
      } else {
        player.isMoving = false;
        player.walkCycle = 0;
      }
    }

    function draw() {
      ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

      ctx.save(); 

      // 走路搖晃計算
      let offsetY = 0;
      let rotationAngle = 0;

      if (player.isMoving) {
        offsetY = Math.sin(player.walkCycle * 2) * 4;         
        rotationAngle = Math.sin(player.walkCycle) * 0.08;   
      }

      ctx.translate(player.x, player.y + offsetY);
      ctx.rotate(rotationAngle);

      const currentImg = images[player.frame];

      if (player.isFacingLeft) {
        ctx.scale(-1, 1);
        ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);

        if (player.isAttacking && player.frame === 1) {
          ctx.beginPath();
          ctx.arc(player.hitboxOffsetX, player.hitboxOffsetY, player.hitboxRadius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 64, 129, 0.4)';
          ctx.fill();
        }

      } else {
        ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);

        if (player.isAttacking && player.frame === 1) {
          ctx.beginPath();
          ctx.arc(player.hitboxOffsetX, player.hitboxOffsetY, player.hitboxRadius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 64, 129, 0.4)';
          ctx.fill();
        }
      }

      ctx.restore(); 
    }

    function playSlash() {
      if (player.isAttacking) return;
      player.isAttacking = true;
      const frameSpeed = 90;

      player.frame = 0; 
      setTimeout(() => {
        player.frame = 1; 
        setTimeout(() => {
          player.frame = 2; 
          setTimeout(() => {
            player.frame = 0; 
            player.isAttacking = false;
          }, frameSpeed);
        }, frameSpeed);
      }, frameSpeed);
    }

    // 點擊事件：指定目標點後走過去
    canvas.addEventListener('pointerdown', (e) => {
      // 攻擊中不受理新的點擊，避免重複觸發
      if (player.isAttacking) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      // 判斷移動方向以正確對齊劍氣中心點
      const isWillFaceLeft = (clickX - player.x) < 0;
      const currentOffsetX = isWillFaceLeft ? -player.hitboxOffsetX : player.hitboxOffsetX;

      player.targetX = clickX - currentOffsetX;
      player.targetY = clickY - player.hitboxOffsetY;
    });
  </script>
</body>
</html>
