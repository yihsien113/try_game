<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>粢涵尋寶去 - 關卡2</title>
  
  <!-- 引入外部注音模組 -->
  <script src="bopomofo.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none; 
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 999;
    }
    .spinner {
      margin-bottom: 20px;
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff4081;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #game-container {
      position: relative;
      width: 95vw;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: none; 
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      text-align: center;
    }

    .intro-copy {
      width: 100%;
      max-width: 720px;
      padding: 14px 18px;
      border-radius: 14px;
      background-color: rgba(0, 0, 0, 0.8);
    }
    
    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      background-color: #ff4081;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
      transition: transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { transform: scale(0.95); }

    #back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      margin: 0;
      padding: 8px 16px;
      font-size: 18px;
      background-color: #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 101; 
      display: none;
    }

    #hud {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 15px;
      pointer-events: none;
      z-index: 100;
      display: none;
      backdrop-filter: blur(4px);
    }

    #star-container {
      font-size: 28px;
      margin-top: 15px;
      width: 100%; 
      text-align: center;
      line-height: 1.5;
      text-shadow: 0 0 10px rgba(255,215,0,0.8);
    }
    
    .math-box {
      background: rgba(43, 39, 39, 0.85);
      padding: 15px 25px;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 28px;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <!-- 進度條保持純文字，不加注音 -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">廚房載入中 (0/5)...</div>
  </div>

  <div id="game-container">
    <button id="back-btn" class="btn" onclick="window.location.href='index.html'">🔙 EXIT</button>

    <div id="hud">⏳ <span id="timerDisplay">20.0</span> | ⚔️ <span id="killDisplay">0</span> | ⭐ <span id="coinDisplay">0</span></div>
    
    <!-- 開始畫面 -->
    <div id="start-screen" class="overlay" style="display: none;">
      <button class="btn" style="position: absolute; top: 15px; left: 15px; margin: 0; padding: 8px 16px; font-size: 18px; background-color: #333;" onclick="window.location.href='index.html'">🔙 EXIT</button>
      
      <div class="intro-copy">
        <!-- 標題：廚房滅蟑大作戰（提高 1.5 倍至 60px） -->
        <h1 class="zh-text" style="display: block; font-size: 60px; margin: 0 0 28px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); color: #fff;">
          <ruby>消<rt>ㄒㄧㄠ</rt></ruby>
          <ruby>滅<rt>ㄇㄧㄝˋ</rt></ruby>
          <ruby>蟑<rt>ㄓㄤ</rt></ruby>
          <ruby>螂<rt>ㄌㄤˊ</rt></ruby>
          <br>
          <ruby>大<rt>ㄉㄚˋ</rt></ruby>
          <ruby>作<rt>ㄗㄨㄛˋ</rt></ruby>
          <ruby>戰<rt>ㄓㄢˋ</rt></ruby>
        </h1>

        <!-- 副標題說明文字（提高 1.5 倍至 33px） -->
        <p class="zh-text" style="display: block; font-size: 40px; margin: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.8); max-width: 100%;">
          <ruby>廚<rt>ㄔㄨˊ</rt></ruby>
          <ruby>房<rt>ㄈㄤˊ</rt></ruby>
          <ruby>出<rt>ㄔㄨ</rt></ruby>
          <ruby>現<rt>ㄒㄧㄢˋ</rt></ruby>
          <ruby>好<rt>ㄏㄠˇ</rt></ruby>
          <ruby>多<rt>ㄉㄨㄛ</rt></ruby><br>
          <ruby>亂<rt>ㄌㄨㄢˋ</rt></ruby>
          <ruby>跑<rt>ㄆㄠˇ</rt></ruby>
          <ruby>的<rt>˙ㄉㄜ</rt></ruby>
          <ruby>蟑<rt>ㄓㄤ</rt></ruby>
          <ruby>螂<rt>ㄌㄤˊ</rt></ruby>
          <span>！</span>
        </p>
      </div>

      <!-- 開始按鈕 -->
      <button class="btn" style="font-size: 32px; padding: 15px 55px;" onclick="startGame()">
        <ruby>開<rt>ㄎㄞ</rt></ruby>
        <ruby>始<rt>ㄕˇ</rt></ruby>
      </button>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="overlay" style="display: none;">
      <!-- 標題：時間到！ -->
      <h1 class="zh-text" style="font-size: 38px; color: #ffeb3b; margin: 0 0 10px 0;">
        <ruby>時<rt>ㄕˊ</rt></ruby>
        <ruby>間<rt>ㄐㄧㄢ</rt></ruby>
        <ruby>到<rt>ㄉㄠˋ</rt></ruby>
        <span>！</span>
      </h1>
      
      <div class="math-box">
        ⚔️: <span id="finalKills">0</span> <br>
        ⭐: <span id="newCoins" style="color:#60ff40;">+0</span> <br>
        <hr style="border-color: rgba(255,255,255,0.2); margin: 10px 0;">
        <span class="zh-text" style="vertical-align: middle;">
          <ruby>總<rt>ㄗㄨㄥˇ</rt></ruby>
          <ruby>共<rt>ㄍㄨㄥˋ</rt></ruby>
          <ruby>存<rt>ㄘㄨㄣˊ</rt></ruby>
          <ruby>款<rt>ㄎㄨㄢˇ</rt></ruby>
          <span>:</span>
        </span>
        <span id="totalCoins" style="color:#ffeb3b; font-weight:bold; font-size: 34px; margin-left: 8px;">0</span> ⭐
      </div>
      
      <div id="star-container"></div>
      
      <!-- 按鈕區：上下排列，規格與 map3 完全一致 -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 15px; width: 100%; max-width: 320px;">
        <button class="btn" style="width: 100%; font-size: 26px; padding: 12px 0; margin: 0;" onclick="startGame()">
          <ruby>再<rt>ㄗㄞˋ</rt></ruby>
          <ruby>玩<rt>ㄨㄢˊ</rt></ruby>
          <ruby>一<rt>ㄧ</rt></ruby>
          <ruby>次<rt>ㄘˋ</rt></ruby>
        </button>

        <button class="btn" style="width: 100%; font-size: 30px; padding: 15px 0; margin: 0; background-color: #2196F3;" onclick="window.location.href='index.html'">
          <ruby>回<rt>ㄏㄨㄟˊ</rt></ruby>
          <ruby>大<rt>ㄉㄚˋ</rt></ruby>
          <ruby>廳<rt>ㄊㄧㄥ</rt></ruby>
        </button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const ROACH_SIZE = 100;
    const ROACH_SPEED = 170;
    const DROP_RATE = 0.65;

    const CHARACTERS = {
      'han1': {
        name: '揮劍女孩', prefix: 'han1', size: 160, hitboxOffsetX: 100, hitboxOffsetY: 0, hitboxRadius: 40,
        drawEffect: (ctx, p, startX, startY, targetX, targetY) => {
          ctx.save(); ctx.strokeStyle = `rgba(135, 206, 235, ${1 - p})`; ctx.shadowColor = '#00bfff'; ctx.shadowBlur = 15; ctx.lineWidth = 12 * (1 - p);
          ctx.beginPath(); ctx.arc(targetX, targetY, 30 + p * 40, -Math.PI / 2, Math.PI / 2); ctx.stroke(); ctx.restore();
        }
      },
      'han2': {
        name: '弓箭公主', prefix: 'han2', size: 170, hitboxOffsetX: 130, hitboxOffsetY: 0, hitboxRadius: 50,
        drawEffect: (ctx, p, startX, startY, targetX, targetY) => {
          ctx.save(); ctx.strokeStyle = `rgba(255, 105, 180, ${1 - p})`; ctx.shadowColor = '#ff1493'; ctx.shadowBlur = 20; ctx.lineWidth = 8 * (1 - p);
          ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(targetX, targetY); ctx.stroke();
          ctx.font = `${30 + p * 30}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = 1 - p; ctx.fillText('💖', targetX, targetY - p * 20); ctx.restore();
        }
      },
      'han3': {
        name: '魔法仙子', prefix: 'han3', size: 160, hitboxOffsetX: 110, hitboxOffsetY: 0, hitboxRadius: 60,
        drawEffect: (ctx, p, startX, startY, targetX, targetY) => {
          ctx.save();
          const dropY = targetY - 200 * (1 - p); 
          ctx.translate(targetX, dropY);
          ctx.rotate(p * Math.PI * 4); 
          ctx.shadowColor = '#FFD700';
          ctx.shadowBlur = 15 + p * 15;
          ctx.globalAlpha = Math.min(1, p * 2.5); 
          ctx.font = `${60 + Math.sin(p * Math.PI) * 20}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🌙', 0, 0);
          
          if (p > 0.7) {
            const burstP = (p - 0.7) / 0.3; 
            ctx.rotate(-p * Math.PI * 4); 
            for (let i = 0; i < 6; i++) {
              const angle = (i * Math.PI * 2) / 6;
              const dist = burstP * 80;
              ctx.globalAlpha = 1 - burstP;
              ctx.font = `${25 * (1 - burstP * 0.5)}px sans-serif`;
              ctx.fillText('✨', Math.cos(angle) * dist, Math.sin(angle) * dist);
            }
          }
          ctx.restore();
        }
      },
      'han4': {
        name: '漩渦公主',
        prefix: 'han4',
        size: 165,
        hitboxOffsetX: 120,
        hitboxOffsetY: 0,
        hitboxRadius: 55,
        drawEffect: (ctx, p, startX, startY, targetX, targetY) => {
          ctx.save(); // 【第 1 次 save：保存畫布全域狀態】
          ctx.translate(targetX, targetY);

          // 1. 紫色吸力旋渦
          ctx.rotate(-p * Math.PI * 8);
          ctx.lineWidth = 6 * (1 - p);
          for (let r = 25; r <= 95; r += 22) {
            ctx.strokeStyle = `rgba(186, 104, 200, ${1 - p})`;
            ctx.shadowColor = '#e1bee7';
            ctx.shadowBlur = 12 * (1 - p);
            ctx.beginPath();
            ctx.arc(0, 0, r * (1 - p * 0.4), 0, Math.PI * 1.4);
            ctx.stroke();
          }

          // 2. 吸入雜物 (襪子、積木、小熊、亮粉、氣流)
          const items = ['🧦', '🧱', '🧸', '✨', '💨'];
          items.forEach((item, idx) => {
            const angle = (idx * Math.PI * 2) / items.length + p * Math.PI * 4;
            const dist = (1 - p) * 115;
            const itemScale = Math.max(0.2, 1 - p * 0.8);
            ctx.save();
            ctx.font = `${26 * itemScale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.globalAlpha = Math.max(0, 1 - p * 0.5);
            ctx.fillText(item, Math.cos(angle) * dist, Math.sin(angle) * dist);
            ctx.restore();
          });

          // 3. 收尾特效：冒出煙霧 💨 與四散星星 ✨（不另外 save/restore）
          if (p > 0.65) {
            const popP = (p - 0.65) / 0.35;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.globalAlpha = Math.max(0, 1 - popP);

            const cloudScale = 40 + popP * 30;
            ctx.font = `${cloudScale}px sans-serif`;
            ctx.fillText('💨', 0, 0);

            const starCount = 5;
            const starDist = popP * 60;
            ctx.font = `${22 * (1 - popP * 0.3)}px sans-serif`;
            for (let i = 0; i < starCount; i++) {
              const a = (i * Math.PI * 2) / starCount + popP * 2;
              ctx.fillText('✨', Math.cos(a) * starDist, Math.sin(a) * starDist);
            }
          }

          ctx.restore(); // 【第 1 次 restore：一次還原所有坐標與屬性】
        }
      }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let kills = 0;
    let coins = 0;
    let timeLeft = 20.0;
    let isPlaying = false;
    let lastTime = 0; 
    let activeEffects = []; 
    let clockItems = []; 
    let clockSpawnTimer = 0;
    let popupTexts = []; 

    let equippedCharKey = localStorage.getItem('equippedCharacter') || 'han1';
    let charConfig = CHARACTERS[equippedCharKey] || CHARACTERS['han1'];

    const player = {
      x: 0, y: 0, size: charConfig.size, speedPxPerSec: 900, targetX: 0, targetY: 0, frame: 0, 
      isAttacking: false, isFacingLeft: false, isMoving: false, walkCycle: 0,        
      hitboxOffsetX: charConfig.hitboxOffsetX, hitboxOffsetY: charConfig.hitboxOffsetY, hitboxRadius: charConfig.hitboxRadius     
    };

    const monster = {
      x: 0, y: 0, 
      targetX: 0, targetY: 0,
      size: ROACH_SIZE, 
      speed: ROACH_SPEED,
      isVisible: false, 
      spawnTime: 0,
      walkCycle: 0
    };

    const recentMonsterSpawns = [];

    function getRandomZonePoint() {
      const margin = ROACH_SIZE;
      const rx = margin + Math.random() * (canvas.width - margin * 2);
      const ry = canvas.height * 0.4 + Math.random() * (canvas.height * 0.55 - margin);
      return { x: rx, y: ry };
    }

    function getInitialRoachTarget() {
      const towardPlayerX = player.x - monster.x;
      const towardPlayerY = player.y - monster.y;
      const playerDistance = Math.hypot(towardPlayerX, towardPlayerY);
      const margin = ROACH_SIZE;
      const minY = canvas.height * 0.4;
      const maxY = canvas.height * 0.95 - margin;

      if (playerDistance === 0) return getRandomZonePoint();

      for (let i = 0; i < 100; i++) {
        const target = getRandomZonePoint();
        const dx = target.x - monster.x;
        const dy = target.y - monster.y;
        const distance = Math.hypot(dx, dy);
        if (distance === 0) continue;

        const alignment = (dx * towardPlayerX + dy * towardPlayerY) / (distance * playerDistance);
        if (alignment <= 0) return target;
      }

      const corners = [
        { x: margin, y: minY },
        { x: canvas.width - margin, y: minY },
        { x: margin, y: maxY },
        { x: canvas.width - margin, y: maxY }
      ];
      for (const target of corners) {
        const dx = target.x - monster.x;
        const dy = target.y - monster.y;
        const distance = Math.hypot(dx, dy);
        if (distance === 0) continue;

        const alignment = (dx * towardPlayerX + dy * towardPlayerY) / (distance * playerDistance);
        if (alignment <= 0) return target;
      }

      return null;
    }

    function spawnMonster() {
      const candidates = [];
      for (let i = 0; i < 200; i++) {
        const pos = getRandomZonePoint();
        monster.x = pos.x;
        monster.y = pos.y;
        const target = getInitialRoachTarget() || {
          x: player.x < pos.x ? canvas.width - ROACH_SIZE : ROACH_SIZE,
          y: pos.y
        };

        const playerDistance = Math.hypot(player.x - pos.x, player.y - pos.y);
        const nearestRecentDistance = recentMonsterSpawns.length
          ? Math.min(...recentMonsterSpawns.map(spawn => Math.hypot(spawn.x - pos.x, spawn.y - pos.y)))
          : Infinity;
        candidates.push({ ...pos, target, playerDistance, nearestRecentDistance });
      }

      const minPlayerDistance = Math.max(ROACH_SIZE * 2.2, player.size * 1.25);
      const minRecentDistance = Math.max(ROACH_SIZE * 3, canvas.width * 0.18);
      const safeCandidates = candidates.filter(candidate => candidate.playerDistance >= minPlayerDistance);
      const variedCandidates = safeCandidates.filter(candidate => candidate.nearestRecentDistance >= minRecentDistance);
      const eligibleCandidates = variedCandidates.length ? variedCandidates : safeCandidates;
      const selected = eligibleCandidates.length
        ? eligibleCandidates[Math.floor(Math.random() * eligibleCandidates.length)]
        : candidates.reduce((farthest, candidate) => (
            !farthest || candidate.playerDistance > farthest.playerDistance ? candidate : farthest
          ), null);

      const spawn = selected || getRandomZonePoint();

      monster.x = spawn.x;
      monster.y = spawn.y;
      monster.targetX = spawn.target ? spawn.target.x : (player.x < spawn.x ? canvas.width - ROACH_SIZE : ROACH_SIZE);
      monster.targetY = spawn.target ? spawn.target.y : spawn.y;
      recentMonsterSpawns.push({ x: monster.x, y: monster.y });
      if (recentMonsterSpawns.length > 4) recentMonsterSpawns.shift();
      
      monster.isVisible = true;
      monster.spawnTime = performance.now(); 
      monster.walkCycle = 0;
    }

    function spawnClock() {
      const pos = getRandomZonePoint();
      clockItems.push({
          x: pos.x,
          y: pos.y,
          size: 80,
          spawnTime: performance.now()
      });
    }

    function addPopup(text, x, y, color = '#fff', size = 30) {
        popupTexts.push({
            text: text,
            x: x,
            y: y,
            color: color,
            size: size,
            startTime: performance.now(),
            duration: 1000 
        });
    }

    let totalAssets = 5; 
    let loadedAssets = 0;
    function checkLoadProgress() {
      loadedAssets++;
      document.getElementById('loading-text').innerText = `廚房載入中 (${loadedAssets}/${totalAssets})...`;
      if (loadedAssets >= totalAssets) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('start-screen').style.display = 'flex';
        draw(); 
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    const bgImg = new Image();
    bgImg.src = 'assets/map/map2.webp'; 
    bgImg.onload = () => {
      canvas.width = bgImg.width;
      canvas.height = bgImg.height;
      document.getElementById('game-container').style.aspectRatio = `${bgImg.width} / ${bgImg.height}`;
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;
      checkLoadProgress();
    };

    const playerImages = [];
    [1, 2, 3].forEach((num, idx) => {
      const img = new Image();
      img.src = `assets/han/${charConfig.prefix}-${num}.webp`; 
      img.onload = () => checkLoadProgress();
      playerImages[idx] = img;
    });

    const roachImg = new Image();
    roachImg.src = 'assets/bad/bad2.webp';
    roachImg.onload = () => checkLoadProgress();

    function startGame() {
      kills = 0;
      coins = 0;
      timeLeft = 20.0;
      isPlaying = true;
      recentMonsterSpawns.length = 0;
      activeEffects = [];
      clockItems = [];
      popupTexts = [];
      clockSpawnTimer = 0;
      
      document.getElementById('back-btn').style.display = 'block';
      updateHUD();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;
      player.isMoving = false;
      player.isAttacking = false;
      player.frame = 0;
      
      spawnMonster();
    }

    function updateHUD() {
        document.getElementById('killDisplay').innerText = kills;
        document.getElementById('coinDisplay').innerText = coins;
        document.getElementById('timerDisplay').innerText = Math.max(0, timeLeft).toFixed(1);
    }

    function endGame() {
      isPlaying = false;
      document.getElementById('back-btn').style.display = 'none';
      monster.isVisible = false;
      player.isMoving = false;
      document.getElementById('hud').style.display = 'none';
      
      let currentCoins = parseInt(localStorage.getItem('playerCoins') || '0');
      let newTotalCoins = currentCoins + coins;
      localStorage.setItem('playerCoins', newTotalCoins); 
      
      document.getElementById('finalKills').innerText = kills;
      document.getElementById('newCoins').innerText = "+" + coins;
      document.getElementById('totalCoins').innerText = newTotalCoins;
      
      let killsHtml = '';
      for (let i = 1; i <= coins; i++) {
        killsHtml += '⭐';
        if (i % 10 === 0) killsHtml += '<br>'; 
      }
      document.getElementById('star-container').innerHTML = killsHtml;
      document.getElementById('result-screen').style.display = 'flex';
    }

    function gameLoop(currentTime) {
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      if(isPlaying || activeEffects.length > 0 || popupTexts.length > 0) {
        update(Math.min(dt, 0.1));
        draw();
      }
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      if (isPlaying) {
          timeLeft -= dt;
          updateHUD();
          
          if (timeLeft <= 0) {
              endGame();
              return;
          }

          clockSpawnTimer += dt;
          if (clockSpawnTimer >= 5.0) {
              spawnClock();
              clockSpawnTimer = 0;
          }

          if (monster.isVisible) {
              let dx = monster.targetX - monster.x;
              let dy = monster.targetY - monster.y;
              let distance = Math.sqrt(dx * dx + dy * dy);
              let moveDist = monster.speed * dt;

              if (distance > moveDist) {
                  monster.x += (dx / distance) * moveDist;
                  monster.y += (dy / distance) * moveDist;
                  monster.walkCycle += 25 * dt; 
              } else {
                  const nextTarget = getRandomZonePoint();
                  monster.targetX = nextTarget.x;
                  monster.targetY = nextTarget.y;
              }
          }
      }

      if (!player.isAttacking) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let moveDist = player.speedPxPerSec * dt;

        if (distance > moveDist) {
          player.x += (dx / distance) * moveDist;
          player.y += (dy / distance) * moveDist;
          player.isMoving = true;
          player.walkCycle += 25 * dt; 
        } else {
          if (player.isMoving) {
            player.x = player.targetX;
            player.y = player.targetY;
            player.isMoving = false;
            player.walkCycle = 0;
            playSlash();
          }
        }
      }
    }

    function draw() {
      ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      const now = performance.now();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let clock of clockItems) {
          ctx.save();
          ctx.translate(clock.x, clock.y);
          let sway = Math.sin((now - clock.spawnTime) / 150) * 0.3; 
          ctx.rotate(sway);
          ctx.font = `${clock.size}px sans-serif`;
          ctx.fillText('⏱️', 0, 0);
          ctx.restore();
      }

      if (monster.isVisible && roachImg.complete) {
        ctx.save();
        ctx.translate(monster.x, monster.y);
        
        const movementAngle = Math.atan2(monster.targetY - monster.y, monster.targetX - monster.x);
        const roachScaleY = 1 + Math.abs(Math.sin(monster.walkCycle * 2)) * 0.1;

        ctx.rotate(movementAngle + Math.PI / 2);
        ctx.scale(1, roachScaleY);

        ctx.drawImage(roachImg, -monster.size / 2, -monster.size / 2, monster.size, monster.size);
        ctx.restore();
      }

      ctx.save(); 
      let offsetY = player.isMoving ? Math.sin(player.walkCycle * 2) * 6 : 0;         
      let rotationAngle = player.isMoving ? Math.sin(player.walkCycle) * 0.20 : 0;   

      ctx.translate(player.x, player.y + offsetY);
      ctx.rotate(rotationAngle);
      
      const currentImg = playerImages[player.frame];
      if(currentImg) {
          if (player.isFacingLeft) {
            ctx.scale(-1, 1);
            ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);
          } else {
            ctx.drawImage(currentImg, -player.size / 2, -player.size / 2, player.size, player.size);
          }
      }
      ctx.restore(); 

      for (let i = activeEffects.length - 1; i >= 0; i--) {
        const fx = activeEffects[i];
        const progress = (now - fx.startTime) / fx.duration;
        if (progress >= 1) {
          activeEffects.splice(i, 1);
        } else {
          charConfig.drawEffect(ctx, progress, fx.startX, fx.startY, fx.targetX, fx.targetY);
        }
      }

      for (let i = popupTexts.length - 1; i >= 0; i--) {
          const popup = popupTexts[i];
          const progress = (now - popup.startTime) / popup.duration;
          
          if (progress >= 1) {
              popupTexts.splice(i, 1);
          } else {
              ctx.save();
              ctx.globalAlpha = 1 - Math.pow(progress, 3); 
              const floatY = popup.y - (progress * 50); 
              ctx.font = `bold ${popup.size}px sans-serif`;
              ctx.fillStyle = popup.color;
              ctx.strokeStyle = '#000';
              ctx.lineWidth = 4;
              ctx.strokeText(popup.text, popup.x, floatY);
              ctx.fillText(popup.text, popup.x, floatY);
              ctx.restore();
          }
      }
    }

    function playSlash() {
      if (player.isAttacking) return;
      player.isAttacking = true;
      const frameSpeed = 100;

      player.frame = 0; 
      setTimeout(() => {
        player.frame = 1; 
        
        const currentOffsetX = player.isFacingLeft ? -player.hitboxOffsetX : player.hitboxOffsetX;
        const attackCenterX = player.x + currentOffsetX;
        const attackCenterY = player.y + player.hitboxOffsetY;
        const attackRadius = player.hitboxRadius;
        
        activeEffects.push({
            startTime: performance.now(),
            duration: 250, 
            startX: player.x,
            startY: player.y - 20, 
            targetX: attackCenterX,
            targetY: attackCenterY
        });
        
        if (isPlaying) {
            const distToMonster = Math.sqrt(Math.pow(attackCenterX - monster.x, 2) + Math.pow(attackCenterY - monster.y, 2));
            if (monster.isVisible && distToMonster <= (attackRadius + monster.size / 2)) {
              monster.isVisible = false;
              kills++;

              if (Math.random() < DROP_RATE) {
                  coins++;
                  addPopup('⭐', monster.x, monster.y, '#FFD700', 40);
              }

              updateHUD();
              spawnMonster(); 
            }

            for (let i = clockItems.length - 1; i >= 0; i--) {
                let clock = clockItems[i];
                let distToClock = Math.sqrt(Math.pow(attackCenterX - clock.x, 2) + Math.pow(attackCenterY - clock.y, 2));
                if (distToClock <= (attackRadius + clock.size / 2)) {
                    timeLeft += 2.5;
                    addPopup('+2.5s', clock.x, clock.y, '#00FF00', 30);
                    clockItems.splice(i, 1); 
                    updateHUD();
                }
            }
        }

        setTimeout(() => {
          player.frame = 2; 
          setTimeout(() => {
            player.frame = 0; 
            player.isAttacking = false;
          }, frameSpeed);
        }, frameSpeed);
      }, frameSpeed);
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.target.tagName.toLowerCase() === 'button') return;

      if (!isPlaying || player.isAttacking) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      player.isFacingLeft = clickX < player.x;
      player.targetX = player.isFacingLeft ? clickX + player.hitboxOffsetX : clickX - player.hitboxOffsetX;
      player.targetY = clickY - player.hitboxOffsetY;

      if (Math.sqrt(Math.pow(player.targetX - player.x, 2) + Math.pow(player.targetY - player.y, 2)) <= 15) {
        playSlash();
      } else {
        player.isMoving = true;
      }
    });
  </script>
